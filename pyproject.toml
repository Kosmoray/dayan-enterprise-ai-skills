[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dayan-enterprise-ai-skills"
version = "1.5.0"
description = "156 Battle-Tested Enterprise AI Agent Skills, 25 WorkBuddy Expert Teams & 12 Zero-Dependency Executive CLI Tools by Chengdu Dayan Qianji Technology Co., Ltd. (雷可扬)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Keyang Lei (雷可扬) · 成都大衍千机科技有限公司", email = "contact@dayanqianji.com"}
]
keywords = [
  "ai-agents",
  "claude-code",
  "agent-skills",
  "workbuddy",
  "skillhub",
  "enterprise-ai",
  "b2b",
  "rag",
  "humanize",
  "contract-audit",
  "geo"
]
urls = {Homepage = "https://dayanqianji.com/open-source/", Repository = "https://github.com/Kosmoray/dayan-enterprise-ai-skills", Documentation = "https://kosmoray.github.io/dayan-enterprise-ai-skills/"}

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["industry"]
py-modules = [
  "dayan_humanize_lint",
  "dayan_html_compiler",
  "dayan_skill_finder",
  "dayan_contract_quickscan",
  "dayan_catalog_data"
]

[project.scripts]
dayan-lint = "dayan_humanize_lint:main"
dayan-html = "dayan_html_compiler:main"
dayan-find = "dayan_skill_finder:main"
dayan-contract = "dayan_contract_quickscan:main"
dayan-ev-tco = "industry.ev_station_tco_calc:main"
dayan-vet-check = "industry.vet_dose_compliance_check:main"
dayan-gjb-kit = "industry.gjb_kit_shortage_audit:main"
dayan-gb7718 = "industry.gb7718_oem_quote_guard:main"
dayan-cis-doc = "industry.cis_export_doc_checker:main"
dayan-lc-calc = "industry.liquid_cooling_uqd_calc:main"
dayan-pool-roi = "industry.pool_pump_filter_roi_calc:main"
dayan-xfmr-toc = "industry.transformer_bom_quote_guard:main"
