<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
  <rect width="1200" height="470" rx="14" fill="#F7F5F0" stroke="#E2E8F0"/>
  <text x="36" y="44" fill="#1B365D" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800">3 秒看懂差距：裸调大模型 vs 挂载大衍千机实战 Skill</text>
  <text x="36" y="70" fill="#5F6B7C" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5">不是教你背玄学提示词，而是把我们在真实客户现场踩坑炼出来的「规则闸门、反方审查与交付母版」直接装进你的 AI。</text>

  <!-- Column Headers -->
  <rect x="36" y="92" width="548" height="38" rx="8" fill="#F8E9E9" stroke="#D7263D"/>
  <text x="56" y="116" fill="#9E1B1B" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14.5" font-weight="700">❌ 裸调大模型（一眼假、不敢发给老板和客户）</text>

  <rect x="616" y="92" width="548" height="38" rx="8" fill="#EAF0F8" stroke="#1B365D"/>
  <text x="636" y="116" fill="#1B365D" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14.5" font-weight="700">✅ 挂载大衍千机 Skill 后（直接可拍板、可签单的成稿）</text>

  <!-- Row 1: Humanize -->
  <rect x="36" y="144" width="548" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="170" fill="#9E1B1B" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700">场景 1：写对外方案 / 公众号长文</text>
  <text x="54" y="195" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">“通过数字化深度赋能，打造全方位业务闭环，拉通前后端链路，</text>
  <text x="54" y="216" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">为您提供高效、专业、贴心的一站式服务，携手共创美好未来！”</text>

  <rect x="616" y="144" width="548" height="90" rx="10" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
  <text x="634" y="170" fill="#AD7B27" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">dayan-humanize-pro · 中文去AI味与人话精修大师</text>
  <text x="634" y="195" fill="#111827" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">“把订单数据接进同一张表，销售、仓库和财务看同一份数字，每天少对</text>
  <text x="634" y="216" fill="#111827" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">三次账。周四前我先给一版可跑的样表，您看合不合业务口径。”</text>

  <!-- Row 2: Contract 4-way Audit -->
  <rect x="36" y="248" width="548" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="274" fill="#9E1B1B" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700">场景 2：审定制开发或采购合同</text>
  <text x="54" y="299" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">“这份合同整体结构完整，建议注意一下付款节点、违约责任与保密</text>
  <text x="54" y="320" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">条款，双方友好协商推进即可。”（漏掉致命连带索赔与需求蔓延坑）</text>

  <rect x="616" y="248" width="548" height="90" rx="10" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
  <text x="634" y="274" fill="#AD7B27" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">dayan-contract-4way-audit · 交付/财务/法务/销售四视角并审</text>
  <text x="634" y="299" fill="#111827" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">“🔴 红灯拦截：① 验收写‘以甲方满意为准’必亏穿 → 改5工作日默示验收；</text>
  <text x="634" y="320" fill="#111827" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">② 赔偿未封顶 → 锁死已收服务费上限（附不伤和气的销售谈判替换句）”</text>

  <!-- Row 3: Bid Writer & HTML -->
  <rect x="36" y="352" width="548" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="378" fill="#9E1B1B" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700">场景 3：写投标技术方案 / 给老板交阶段汇报</text>
  <text x="54" y="403" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">一次性吐出几千字干巴巴纯文本，瞎编不存在的国标文号，漏答 ★ 号</text>
  <text x="54" y="424" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">废标条款，老板在手机微信里滑两屏直接关掉。</text>

  <rect x="616" y="352" width="548" height="92" rx="10" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
  <text x="634" y="378" fill="#AD7B27" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">dayan-bid-scoring-loop + dayan-business-html</text>
  <text x="634" y="403" fill="#111827" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">先过废标红绿灯 → 写手出稿 → 独立只读评委逐项打分找扣分点收敛；</text>
  <text x="634" y="424" fill="#111827" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">汇报一键压成 #1B365D 深蓝政商风单文件 HTML 网页，发微信点开即拍板！</text>
</svg>
